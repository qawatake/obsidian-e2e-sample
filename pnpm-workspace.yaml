# Lifecycle scripts are blocked by default (pnpm 10). Allow only what really
# needs a postinstall, one package at a time, with a reason (`onlyBuiltDependencies`).
# Nothing needs one today:
# - electron (>= 42) has no postinstall. It downloads its binary on first use, when
#   Playwright's `_electron.launch()` requires `electron`, and verifies it against the
#   checksums.json shipped in the package (`Downloading Electron binary...` in the e2e log).
#   https://github.com/electron/electron/blob/main/docs/breaking-changes.md#behavior-changed-electron-no-longer-downloads-itself-via-postinstall-script
# esbuild ships prebuilt binaries via optionalDependencies; its postinstall is only a
# sanity check, so keep it blocked instead of allow-listing it.
ignoredBuiltDependencies:
  - esbuild
