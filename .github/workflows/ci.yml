name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    # Weekly, Monday 06:00 JST (Sunday 21:00 UTC): catch breakage from new Obsidian releases.
    - cron: "0 21 * * 0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: 2026.8.3
          install: true
          cache: true
      - run: pnpm install --frozen-lockfile
      # Fail on known vulnerabilities (ignores are listed with reasons in pnpm-workspace.yaml)
      - run: pnpm audit --audit-level=high
      - run: pnpm build

  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: 2026.8.3
          install: true
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/setup-obsidian.sh --ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm e2e:setup
      - run: pnpm e2e

  test-e2e-tools:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: 2026.8.3
          install: true
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/setup-obsidian.sh --ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm e2e:setup
      - run: pnpm e2e:cleanup
